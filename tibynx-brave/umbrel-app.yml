releaseNotes: >-
  This release contains updates from version 1.87.191 to version 1.88.136.

  Highlights include:
    - Addressed an XSS vulnerability by fixing the "Gate3" explorer URL validation.
    - Added an "Ultra dark theme" option, updated the themes/colors for Private and Tor windows, and updated the 12-hour clock widget on the New Tab Page to display AM/PM.
    - Added settings to let users hide the "Share menu" icon and the "Install app" icon for PWAs directly from the address bar.
    - Implemented a persistent search box at the top of the brave://settings page, replacing the old top navigation bar.
    - Enabled the "Local Network Access" permission by default.
    - Fixed an issue where the Rewards panel displayed the wrong verified creator in certain edge cases.
    - Fixed a visible separator at the top of videos when watching in fullscreen mode.
    - Fixed missing tab favicons when a pinned tab is restored while vertical tabs are enabled.
    - Upgraded Chromium to 146.0.7680.164.

  Release notes can be found at https://github.com/brave/brave-browser/releases/tag/v1.88.136

releaseNotes: >-
  This release contains updates from version 1.88.137 to version 1.90.128.

  Highlights include:
    - Improved vertical tabs.
    - Added a new “regex-path-template” debounce action type.
    - Added prefix and suffix for custom scriptlet names.
    - Added “Use scrollable tab strip” setting under brave://settings/appearance.
    - Fixed some styling issues for dark theme.
    - Upgraded Chromium to 148.0.7778.217.


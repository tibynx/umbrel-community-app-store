releaseNotes: >-
  This release contains updates from version 1.88.137 to version 1.90.128.

  Highlights include:
    - Added "Use compact mode" setting under brave://settings/appearance.
    - Added "Local history retention" setting under brave://settings/privacy.
    - Added context menu to the tab search button.
    - Added new WebGPU webcompat content settings type.
    - Updated some icons.
    - Updated the sidebar to work independently from side panels.
    - Fixed issue where custom high-resolution background uploads for the New Tab Page caused the browser to get stuck in a loading state.
    - Fixed inability to play H.265/HEVC videos on Windows and Linux.
    - Upgraded Chromium to 151.0.7922.71.

  Release notes can be found at https://github.com/brave/brave-browser/releases/tag/v1.93.129

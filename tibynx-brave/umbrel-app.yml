releaseNotes: >-
  This release contains updates from version 1.86.146 to version 1.87.191.

  Highlights include:
    - Added the ability to “Copy download link” from the download panel.
    - Improved adblocking.
    - Improved vertical tabs.
    - Fixed tab names being blank on Linux in certain cases.
    - Fixed hidden elements on the New Tab Page being clickable when the search widget has focus.
    - Fixed custom homepage address being displayed incorrectly in certain cases. 
    - Upgraded Chromium to 145.0.7632.120.

  Release notes can be found at https://github.com/brave/brave-browser/releases/tag/v1.87.191

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tibynx-brave_server_1
      APP_PORT: 3000

  server:
    image: tibynx/brave:1.87.191@sha256:3343ce14bd4f455e33509489c130c8e10ca4d3f0cb02e04939c0c7cdbafe4be1
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    security_opt:
      - no-new-privileges:true
    ports:
      - 3577:3001
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tibynx-brave_server_1
      APP_PORT: 3000

  server:
    image: tibynx/brave:1.85.118@sha256:61aa0a865e4940ad0de70297fbd2a8f53cc415599971e176d91ad58872fa8c46
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    security_opt:
      - no-new-privileges:true
    ports:
      - 3577:3001
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
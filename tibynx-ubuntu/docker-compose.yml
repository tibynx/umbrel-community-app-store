version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tibynx-ubuntu_server_1
      APP_PORT: 3000

  server:
    image: tibynx/webtop:ubuntu-20260101-220459@sha256:ffa6522a9e1c82e53be4c04f991670def8eb135e1a592a1dda21cae41d101a8d
    security_opt:
      - seccomp:unconfined
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
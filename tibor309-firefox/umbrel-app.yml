releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - Fixed an issue where the list of available locales in about:settings contained more locales than were downloaded or currently supported.
    - Fixed an issue where using the keyboard to open the Unified Search dropdown was inconsistent. The dropdown now expands properly, allowing users to select a search engine using the keyboard.
    - Fixed an issue where curated photo collections on Microsoft OneDrive's Photos “For You” page failed to load, showing a gray screen instead of content. Collections now display as expected.


  Full release notes can be found at https://www.mozilla.org/en-US/firefox/144.0.2/releasenotes/

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tibynx-firefox_server_1
      APP_PORT: 3000

  server:
    image: tibynx/firefox:147.0.2@sha256:a70ff866f138b3c2fad5b343d2ee6b5f62d59a7b420ef8690e42b8701734dbb9
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
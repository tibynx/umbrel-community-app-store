version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tibynx-firefox_server_1
      APP_PORT: 3000

  server:
    image: tibynx/firefox:148.0@sha256:1320f0cf99f636ae9d73d74029a4488f7c4b2308bf5ba43298132d5794081710
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
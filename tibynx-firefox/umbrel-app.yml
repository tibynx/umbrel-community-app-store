releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - Added an AI Controls section to Settings for managing AI-enhanced features.
    - New Tab wallpapers will now appear on new container tabs as well as new default tabs.
    - Fixed an issue where a language pack could become disabled after a major update, causing Firefox to display in the wrong language.   
    - Added policy to prevent closing the browser by closing the last open tab. 


  Release notes for 148.0: https://www.firefox.com/en-US/firefox/148.0/releasenotes/

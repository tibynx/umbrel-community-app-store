releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - Improved overall stability by fixing crashes related to browsing, graphics, and accessibility features.
    - Fixed crashes related to media playback and GMP process shutdown.
    - Improved sidebar text contrast when using vertical tabs with certain themes.


  Release notes for 146.0: https://www.firefox.com/en-US/firefox/146.0/releasenotes/

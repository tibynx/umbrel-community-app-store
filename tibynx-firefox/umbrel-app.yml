releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - Improved Split View.
    - Firefox’s built-in VPN now lets you choose your browsing location.
    - The built-in VPN is now available for users in Canada. Currently available in: Canada, France, Germany, United Kingdom, United States
    - You can now use Firefox’s built-in PDF editor to reorder, copy, paste, delete, merge, and export pages in a PDF.
    - Local network access restrictions are now rolling out to all users. (progressive roll out)
    - Local Firefox profile backups are now available on Linux.
    - Added button to clear browsing data in Private Browsing Mode.
    - Updated Firefox Home (New Tab) with a fresh look.
    - Fixed a crash experienced by users with Intel Raptor Lake CPUs.
    - Fixed an issue where some websites could render incorrectly or fail to load when they used JavaScript to insert WebKit-specific style rules.
    - Fixed an issue where Firefox stopped caching new content once the disk cache was full, causing pages and resources to be re-downloaded from the network on every visit.


  Release notes for 151.0.3: https://www.firefox.com/en-US/firefox/151.0.3/releasenotes/

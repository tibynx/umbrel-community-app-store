releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - Improved video playback performance on systems with AMD GPUs.
    - Firefox now allows you to customize your keyboard shortcuts.
    - A Picture-in-Picture player window can now optionally be opened automatically for a video playing in a tab when that tab goes into the background.
    - Fixed compatibility problems with websites that use the new Compression Dictionaries technology, such as ChatGPT, by temporarily disabling the feature.
    


  Release notes for 147.0: https://www.firefox.com/en-US/firefox/147.0/releasenotes/

releaseNotes: >-
  This release contains several new features, improvements, and bug fixes across various components of the Firefox browser.


  Highlights include:
    - View two pages side-by-side in a single window with the new Split View feature. To create a split view, select one or two tabs and choose Add to Split View or Open in Split View.
    - Firefox now offers a free built-in VPN. You will get 50 GB of protection every month, with the option to turn it on or off for specific websites. This feature is progressively rolling out in the US, UK, Germany and France starting today.
    - Firefox now automatically blocks notifications and permanently revokes permissions for any website flagged as malicious by SafeBrowsing.  
    - Address Autofill is enabled for users in Australia, India, Italy, Poland and Austria.
    - Updated on-device translation support for Bosnian, Norwegian Bokmål, Serbian and Thai — plus improved accuracy for Croatian.
    - Increased robustness of HTTP/3 upload performance for unstable network conditions.
    - On Linux, Firefox will now default to the XDG portal file picker if available, rather than the GTK3 one.
    - Updated graphics for Firefox error pages.


  Release notes for 149.0: https://www.firefox.com/en-US/firefox/149.0/releasenotes/

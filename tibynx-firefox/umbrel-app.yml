manifestVersion: 1.2
id: tibynx-firefox
name: Firefox
tagline: Get the browser that protects what’s important
icon: https://raw.githubusercontent.com/tibynx/umbrel-community-app-store-gallery/refs/heads/main/tibynx-firefox/icon.svg
category: networking
version: "146.0.1"
